<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Processor Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #0088cc; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #006699; }
        #status { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📋 PDF QR Automation Hub</h2>
        <hr>
        <form id="uploadForm">
            <div class="form-group">
                <label for="telegramId">Telegram Chat ID:</label>
                <input type="text" id="telegramId" name="telegramId" placeholder="e.g., 123456789" required>
            </div>
            <div class="form-group">
                <label for="pdfFiles">Select 1-Page Scanned PDFs (Single or Multiple):</label>
                <input type="file" id="pdfFiles" name="pdfFiles" accept="application/pdf" multiple required>
            </div>
            <button type="submit" id="submitBtn">Run Async Process & Send</button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        const telegramIdInput = document.getElementById('telegramId');
        telegramIdInput.value = '1379893386';

        // Link the pdf.js global worker context
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        // Helper function to turn page 1 of a local PDF into an image array and parse its QR code
        function extractQRFromPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        const page = await pdf.getPage(1);
                        
                        // Render page at higher scale resolution to guarantee accurate QR reading
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        
                        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);
                        
                        if (code) {
                            resolve(code.data);
                        } else {
                            reject(new Error(`No QR code detected inside file.`));
                        }
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = () => reject(new Error("File structural reading error."));
                reader.readAsArrayBuffer(file);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const statusDiv = document.getElementById('status');
            
            submitBtn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'success';
            statusDiv.innerHTML = 'Starting automation runner...';

            const files = document.getElementById('pdfFiles').files;
            const telegramId = document.getElementById('telegramId').value;
            const resultsSummary = [];

            // Cycle through all documents sequentially
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerText = `Processing [${i + 1}/${files.length}]: Reading QR code from "${file.name}"...`;

                try {
                    // Read QR Code using client canvas
                    const qrValue = await extractQRFromPDF(file);

                    // Build transmission form data payload
                    const formData = new FormData();
                    formData.append('pdfFile', file);
                    formData.append('telegramId', telegramId);
                    formData.append('qrValue', qrValue);

                    statusDiv.innerText = `Processing [${i + 1}/${files.length}]: Syncing metadata with automation backend...`;

                    const response = await fetch('/process-pdf', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (response.ok) {
                        resultsSummary.push(`✅ ${file.name} -> ${result.message}`);
                    } else {
                        resultsSummary.push(`❌ ${file.name} -> Backend error: ${result.error}`);
                    }
                } catch (err) {
                    resultsSummary.push(`❌ ${file.name} -> ${err.message}`);
                }
            }

        // Output final completion metrics
        statusDiv.innerHTML = `<h3>Process Complete!</h3><ul>${resultsSummary.map(s => `<li>${s}</li>`).join('')}</ul>`;
        submitBtn.disabled = false;
        submitBtn.innerText = 'Run Async Process & Send';
        });
    </script>
</body>
</html>
