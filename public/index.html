<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Processor Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin: auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        button { color: white; padding: 14px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.2s; }
        #lastWeekBtn { background-color: #0088cc; }
        #lastWeekBtn:hover { background-color: #006699; }
        #currentWeekBtn { background-color: #28a745; }
        #currentWeekBtn:hover { background-color: #218838; }
        #viewEvangelistsBtn { background-color: #6c757d; }
        #viewEvangelistsBtn:hover { background-color: #5a6268; }
        button:disabled { background-color: #cccccc !important; cursor: not-allowed; }
        #status { margin-top: 20px; padding: 15px; border-radius: 4px; display: none; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        
        /* Evangelist Modal/Panel Styles */
        #evangelistPanel { display: none; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #ccc; }
        .ev-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 10px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ddd; }
        .ev-item span { font-size: 14px; }
        .ev-actions button { padding: 6px 10px; font-size: 12px; width: auto; margin-left: 5px; }
        .btn-edit { background-color: #ffc107; color: #000; }
        .btn-delete { background-color: #dc3545; }
        .add-box { display: flex; gap: 8px; margin-top: 15px; }
        .add-box input { flex: 1; padding: 8px; }
        .btn-add { background-color: #17a2b8; width: auto; padding: 8px 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📋 PDF QR Automation Hub</h2>
        <hr>
        <form id="uploadForm">
            <div class="form-group">
                <label for="telegramId">Telegram Chat ID:</label>
                <input type="text" id="telegramId" name="telegramId" placeholder="e.g., 123456789" required>
            </div>
            <div class="form-group">
                <label for="pdfFiles">Select Scanned PDFs (Single or Multiple Pages):</label>
                <input type="file" id="pdfFiles" name="pdfFiles" accept="application/pdf" multiple required>
            </div>
            
            <div class="btn-container">
                <button type="submit" id="lastWeekBtn">⏮️ Document Renamer of Last Week</button>
                <button type="submit" id="currentWeekBtn">🆕 New Document Renamer of Current Week</button>
                <button type="button" id="viewEvangelistsBtn">👥 View Saved Evangelist</button>
            </div>
        </form>

        <div id="status"></div>

        <!-- Evangelist Management Panel -->
        <div id="evangelistPanel">
            <h3>Saved Evangelists Management</h3>
            <div id="evListContainer"></div>
            
            <h4>Add New Evangelist</h4>
            <div class="add-box">
                <input type="text" id="newEvNum" placeholder="Assigned No.">
                <input type="text" id="newEvName" placeholder="Full Name">
                <button type="button" class="btn-add" id="addEvBtn">Add</button>
            </div>
        </div>
    </div>

    <script>
        const telegramIdInput = document.getElementById('telegramId');
        telegramIdInput.value = '1379893386';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';

        let activeProcessType = 'last';
        document.getElementById('lastWeekBtn').addEventListener('click', () => activeProcessType = 'last');
        document.getElementById('currentWeekBtn').addEventListener('click', () => activeProcessType = 'current');

        // Toggle Evangelist Panel View
        const evangelistPanel = document.getElementById('evangelistPanel');
        document.getElementById('viewEvangelistsBtn').addEventListener('click', () => {
            if (evangelistPanel.style.display === 'block') {
                evangelistPanel.style.display = 'none';
            } else {
                evangelistPanel.style.display = 'block';
                loadEvangelistsUI();
            }
        });

        // Load Evangelists via API
        async function loadEvangelistsUI() {
            const container = document.getElementById('evListContainer');
            container.innerHTML = 'Loading...';
            try {
                const res = await fetch('/api/evangelists');
                const list = await res.json();
                
                if (list.length === 0) {
                    container.innerHTML = '<p>No saved evangelists found.</p>';
                    return;
                }

                container.innerHTML = '';
                list.forEach(ev => {
                    const div = document.createElement('div');
                    div.className = 'ev-item';
                    div.innerHTML = `
                        <span><strong>${ev.number}</strong>: ${ev.name}</span>
                        <div class="ev-actions">
                            <button class="btn-edit" onclick="renameEvangelist('${ev.number}', '${ev.name}')">Rename</button>
                            <button class="btn-delete" onclick="deleteEvangelist('${ev.number}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                container.innerHTML = '<p style="color:red;">Failed to load evangelists.</p>';
            }
        }

        // Add Evangelist
        document.getElementById('addEvBtn').addEventListener('click', async () => {
            const number = document.getElementById('newEvNum').value.trim();
            const name = document.getElementById('newEvName').value.trim();
            if (!number || !name) {
                alert('Please provide both Assigned Number and Name.');
                return;
            }

            const res = await fetch('/api/evangelists', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ number, name })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('newEvNum').value = '';
                document.getElementById('newEvName').value = '';
                loadEvangelistsUI();
            } else {
                alert(data.error);
            }
        });

        // Rename Evangelist
        window.renameEvangelist = async function(oldNumber, currentName) {
            const newName = prompt(`Enter new name for evangelist (${oldNumber}):`, currentName);
            if (newName === null) return;
            
            const newNum = prompt(`Modify Assigned Number if needed (leave unchanged to keep ${oldNumber}):`, oldNumber);
            if (newNum === null) return;

            const res = await fetch(`/api/evangelists/${oldNumber}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName, newNumber: newNum })
            });
            const data = await res.json();
            if (res.ok) {
                loadEvangelistsUI();
            } else {
                alert(data.error);
            }
        };

        // Delete Evangelist
        window.deleteEvangelist = async function(number) {
            if (!confirm(`Are you sure you want to delete evangelist with number ${number}?`)) return;

            const res = await fetch(`/api/evangelists/${number}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                loadEvangelistsUI();
            } else {
                alert('Failed to delete evangelist.');
            }
        };

        // Helper function: Flattens grey tones into high-contrast pure black/white
        function binarizeImageData(imageData, threshold = 120) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const grayscale = (data[i] * 0.299) + (data[i + 1] * 0.587) + (data[i + 2] * 0.114);
                const value = grayscale < threshold ? 0 : 255;
                data[i] = value;     // Red
                data[i + 1] = value; // Green
                data[i + 2] = value; // Blue
            }
            return imageData;
        }

        function extractQRFromPDF(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    try {
                        const typedarray = new Uint8Array(e.target.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        const page = await pdf.getPage(1);
                        
                        // Higher scale (3.0) for increased DPI on low quality scans
                        const scale = 3.0;
                        const viewport = page.getViewport({ scale: scale });
                        
                        const fullCanvas = document.createElement('canvas');
                        const fullCtx = fullCanvas.getContext('2d');
                        fullCanvas.width = viewport.width;
                        fullCanvas.height = viewport.height;
                        
                        await page.render({ canvasContext: fullCtx, viewport: viewport }).promise;
                        
                        // PASS 1: Raw Full Page Scan
                        let fullImgData = fullCtx.getImageData(0, 0, fullCanvas.width, fullCanvas.height);
                        let code = jsQR(fullImgData.data, fullImgData.width, fullImgData.height);
                        if (code) return resolve(code.data);

                        // PASS 2: Crop Upper-Right Quadrant (where the QR is located)
                        const cropCanvas = document.createElement('canvas');
                        const cropCtx = cropCanvas.getContext('2d');
                        const cropX = Math.floor(fullCanvas.width * 0.35); // Start at 35% width
                        const cropY = 0;
                        const cropW = fullCanvas.width - cropX;
                        const cropH = Math.floor(fullCanvas.height * 0.55); // Top 55% height

                        cropCanvas.width = cropW;
                        cropCanvas.height = cropH;
                        cropCtx.drawImage(fullCanvas, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                        let cropImgData = cropCtx.getImageData(0, 0, cropW, cropH);
                        code = jsQR(cropImgData.data, cropImgData.width, cropImgData.height);
                        if (code) return resolve(code.data);

                        // PASS 3: Binarized / High-Contrast Upper-Right Crop (Flat State Filter)
                        let binarizedCropData = binarizeImageData(cropCtx.getImageData(0, 0, cropW, cropH), 130);
                        code = jsQR(binarizedCropData.data, binarizedCropData.width, binarizedCropData.height);
                        if (code) return resolve(code.data);

                        // PASS 4: Aggressive Threshold Binarized Crop (for very dark/faint scans)
                        let aggressiveCropData = binarizeImageData(cropCtx.getImageData(0, 0, cropW, cropH), 95);
                        code = jsQR(aggressiveCropData.data, aggressiveCropData.width, aggressiveCropData.height);
                        if (code) return resolve(code.data);

                        reject(new Error(`Could not decode QR code even after flattening and image enhancement.`));
                    } catch (err) {
                        reject(err);
                    }
                };
                reader.onerror = () => reject(new Error("File structural reading error."));
                reader.readAsArrayBuffer(file);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const lastWeekBtn = document.getElementById('lastWeekBtn');
            const currentWeekBtn = document.getElementById('currentWeekBtn');
            const statusDiv = document.getElementById('status');
            
            lastWeekBtn.disabled = true;
            currentWeekBtn.disabled = true;
            
            statusDiv.style.display = 'block';
            statusDiv.className = 'success';
            statusDiv.innerHTML = `Starting execution thread for <strong>${activeProcessType === 'current' ? 'Current Week' : 'Last Week'}</strong> workflow...`;

            const files = document.getElementById('pdfFiles').files;
            const telegramId = document.getElementById('telegramId').value;
            const resultsSummary = [];

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.innerText = `Processing [${i + 1}/${files.length}]: Enhancing & Reading QR code from "${file.name}"...`;

                try {
                    const qrValue = await extractQRFromPDF(file);

                    const formData = new FormData();
                    formData.append('pdfFile', file);
                    formData.append('telegramId', telegramId);
                    formData.append('qrValue', qrValue);
                    formData.append('processType', activeProcessType);

                    statusDiv.innerText = `Processing [${i + 1}/${files.length}]: Syncing metadata with automation backend...`;

                    const response = await fetch('/process-pdf', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();

                    if (response.ok) {
                        resultsSummary.push(`✅ ${file.name} -> ${result.message}`);
                    } else {
                        resultsSummary.push(`❌ ${file.name} -> Backend error: ${result.error}`);
                    }
                } catch (err) {
                    resultsSummary.push(`❌ ${file.name} -> ${err.message}`);
                }
            }

            statusDiv.innerHTML = `<h3>Process Complete!</h3><ul>${resultsSummary.map(s => `<li>${s}</li>`).join('')}</ul>`;
            lastWeekBtn.disabled = false;
            currentWeekBtn.disabled = false;
        });
    </script>
</body>
</html>
